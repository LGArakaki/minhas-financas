<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas finanças</title>
<meta name="theme-color" content="#16302b">
<meta name="description" content="Organize rendas, poupanças, dívidas e gastos. Os dados ficam só no seu aparelho.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<style>
:root{--bg:#f2f5f4;--surface:#ffffff;--ink:#16302b;--muted:#5d726c;--line:#d9e2df;--inc:#1b7f5a;--sav:#2b6cb0;--debt:#c4452d;--accent:#16302b;--onaccent:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1816;--surface:#162522;--ink:#e7f1ee;--muted:#9db3ad;--line:#27403b;--inc:#4fc79a;--sav:#7db4f0;--debt:#f08a74;--accent:#e7f1ee;--onaccent:#0e1816;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1816;--surface:#162522;--ink:#e7f1ee;--muted:#9db3ad;--line:#27403b;--inc:#4fc79a;--sav:#7db4f0;--debt:#f08a74;--accent:#e7f1ee;--onaccent:#0e1816;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 96px;max-width:560px;margin-inline:auto;line-height:1.45;font-variant-numeric:tabular-nums}
header{padding:20px 0 8px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:18px;font-weight:800;margin:20px 0 10px}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat.wide{grid-column:1/-1}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-size:20px;font-weight:800}
.inc{color:var(--inc)}.sav{color:var(--sav)}.debt{color:var(--debt)}
svg{width:100%;height:auto;display:block}
svg .lab{fill:var(--muted);font-size:12px;font-family:inherit}
svg .val{fill:var(--ink);font-size:12px;font-weight:700;font-family:inherit}
.b-inc{fill:var(--inc)}.b-sav{fill:var(--sav)}.b-debt{fill:var(--debt)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.track{height:8px;border-radius:4px;background:var(--line);margin:6px 0 0;overflow:hidden}
.track i{display:block;height:100%;border-radius:4px;background:var(--debt)}
.track.g i{background:var(--inc)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;font-size:13px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--onaccent);margin-top:12px;margin-right:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;margin-top:8px}
.btn.danger{background:var(--debt);color:#fff}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.msg{color:var(--muted);font-size:13px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
nav button{flex:1;font:inherit;font-size:13px;font-weight:600;background:none;border:0;color:var(--muted);padding:10px 4px;border-radius:10px}
nav button[aria-current="true"]{color:var(--ink);background:var(--bg)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sav);outline-offset:2px}
select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.chip{font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--onaccent);border-color:var(--accent)}
.warn{color:var(--debt)}
.stat small.n{margin-top:2px}
nav button{font-size:12px;padding:10px 2px}
.chip:focus-visible,select:focus-visible{outline:2px solid var(--sav);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px}
.ib{font:inherit;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.ib svg{width:22px;height:22px}
.ib:focus-visible,#drawer button:focus-visible{outline:2px solid var(--sav);outline-offset:2px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .2s;z-index:20}
#scrim.open{opacity:1;visibility:visible}
#drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:var(--surface);border-right:1px solid var(--line);transform:translateX(-100%);visibility:hidden;transition:transform .2s,visibility .2s;z-index:21;display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px))}
#drawer.open{transform:none;visibility:visible}
#drawer h3{margin:4px 8px 12px;font-size:18px;font-weight:800}
#drawer .dl{flex:1}
#drawer button{display:block;width:100%;text-align:left;font:inherit;font-weight:600;font-size:16px;padding:12px;border:0;border-radius:10px;background:none;color:var(--ink)}
#drawer button[aria-current="true"]{background:var(--bg)}
#drawer .df{border-top:1px solid var(--line);padding-top:8px}
@media (prefers-reduced-motion:reduce){#drawer,#scrim{transition:none}}
</style>
</head>
<body>
<header class="top">
<button id="menu-btn" class="ib" data-a="menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<div><h1 id="h-title">Minhas finanças</h1>
<p class="sub" id="h-sub">Tudo fica salvo só neste aparelho.</p></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="scrim" data-a="menu-close"></div>
<aside id="drawer" aria-label="Menu" aria-hidden="true"><h3>Minhas finanças</h3><div class="dl"></div><div class="df"></div></aside>
<script>
var T={renda:{t:"Rendas",l:"Valor mensal",one:"renda",c:"inc"},poupanca:{t:"Poupanças",l:"Saldo atual",one:"poupança",c:"sav"},divida:{t:"Dívidas",l:"Valor total",one:"dívida",c:"debt"}};
var S={items:[]},tab="resumo",edit=null,del=null,backup="",msg="";
var app=document.getElementById("app"),nav=document.getElementById("nav");
function brl(n){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(n||0)}
function num(s){s=String(s||"").trim();if(s.indexOf(",")>-1){s=s.replace(/\./g,"").replace(",",".")}var v=parseFloat(s);return isNaN(v)?0:v}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function load(){try{var r=localStorage.getItem("fin_v1");if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.items)){S=d}}}catch(e){}}
function save(){try{localStorage.setItem("fin_v1",JSON.stringify(S))}catch(e){msg="Não foi possível salvar neste navegador."}}
function rest(i){return Math.max(i.value-(i.paid||0),0)}
function sum(type,f){return S.items.filter(function(i){return i.type===type}).reduce(function(a,i){return a+f(i)},0)}
function val(i){return i.value}

function resumo(){
 var r=sum("renda",val),p=sum("poupanca",val),d=sum("divida",rest),max=Math.max(r,p,d,1);
 var rows=[["Renda mensal",r,"inc"],["Poupança",p,"sav"],["Dívidas restantes",d,"debt"]];
 var bars=rows.map(function(x,k){var y=k*44,w=x[1]>0?Math.max(x[1]/max*320,4):0;
  return '<text x="0" y="'+(y+12)+'" class="lab">'+x[0]+'</text><text x="320" y="'+(y+12)+'" text-anchor="end" class="val">'+brl(x[1])+'</text><rect x="0" y="'+(y+20)+'" width="320" height="12" rx="6" fill="var(--line)"/><rect x="0" y="'+(y+20)+'" width="'+w+'" height="12" rx="6" class="b-'+x[2]+'"/>'}).join("");
 var net=p-d;
 var debts=S.items.filter(function(i){return i.type==="divida"&&rest(i)>0}).sort(function(a,b){return rest(b)-rest(a)});
 var dm=debts.length?rest(debts[0]):1;
 var dl=debts.length?debts.map(function(i){return '<div style="margin-bottom:10px"><div class="row"><span>'+esc(i.name)+'</span><b>'+brl(rest(i))+'</b></div><div class="track"><i style="width:'+Math.max(rest(i)/dm*100,2)+'%"></i></div></div>'}).join(""):'<p class="empty">Nenhuma dívida em aberto.</p>';
 return '<div class="stats"><div class="stat"><small>Renda mensal</small><b class="inc">'+brl(r)+'</b></div><div class="stat"><small>Poupança</small><b class="sav">'+brl(p)+'</b></div><div class="stat"><small>Dívidas restantes</small><b class="debt">'+brl(d)+'</b></div><div class="stat"><small>Poupança menos dívidas</small><b class="'+(net>=0?"inc":"debt")+'">'+brl(net)+'</b></div></div>'
 +'<div class="card"><svg viewBox="0 0 320 132" role="img" aria-label="Comparação entre renda, poupança e dívidas">'+bars+'</svg></div>'
 +'<h2>Dívidas por item</h2><div class="card">'+dl+'</div>'
 +'<h2>Backup</h2><div class="card"><p class="sub" style="margin:0 0 8px">Se você limpar os dados do navegador, tudo some. Gere um backup e guarde o texto em um lugar seguro.</p><textarea id="bk" aria-label="Texto do backup">'+esc(backup)+'</textarea><button class="btn" data-a="bk-gen">Gerar backup</button><button class="btn ghost" data-a="bk-res">Restaurar do texto</button><p class="msg">'+esc(msg)+'</p></div>';
}

function lista(type){
 var m=T[type],items=S.items.filter(function(i){return i.type===type});
 var e=edit?S.items.filter(function(i){return i.id===edit&&i.type===type})[0]:null;
 var f='<div class="card"><label for="f-name">Nome</label><input id="f-name" placeholder="Ex.: '+(type==="renda"?"Salário":type==="poupanca"?"Caderneta do banco":"Cartão de crédito")+'" value="'+(e?esc(e.name):"")+'">'
 +'<label for="f-val">'+m.l+' (R$)</label><input id="f-val" inputmode="decimal" placeholder="0,00" value="'+(e?String(e.value).replace(".",","):"")+'">'
 +(type==="divida"?'<label for="f-paid">Já pago (R$)</label><input id="f-paid" inputmode="decimal" placeholder="0,00" value="'+(e&&e.paid?String(e.paid).replace(".",","):"")+'">':"")
 +'<button class="btn" data-a="save" data-t="'+type+'">'+(e?"Salvar alterações":"Adicionar "+m.one)+'</button>'+(e?'<button class="btn ghost" data-a="cancel">Cancelar</button>':"")+'<p class="msg">'+esc(msg)+'</p></div>';
 var total=type==="divida"?sum(type,rest):sum(type,val);
 var l=items.length?items.map(function(i){
  var extra="";
  if(type==="divida"){var pc=i.value>0?Math.min((i.paid||0)/i.value*100,100):0;extra='<div class="sub">Restam '+brl(rest(i))+' de '+brl(i.value)+'</div><div class="track g"><i style="width:'+pc+'%"></i></div>'}
  var btns='<button class="btn ghost sm" data-a="edit" data-id="'+i.id+'">Editar</button>'+(del===i.id?'<button class="btn danger sm" data-a="del2" data-id="'+i.id+'">Confirmar exclusão</button>':'<button class="btn ghost sm" data-a="del" data-id="'+i.id+'">Excluir</button>');
  return '<div class="card"><div class="row"><b>'+esc(i.name)+'</b><b class="'+m.c+'">'+brl(type==="divida"?rest(i):i.value)+'</b></div>'+extra+btns+'</div>'}).join(""):'<p class="empty">Nenhuma '+m.one+' cadastrada. Adicione a primeira acima.</p>';
 return '<h2>'+m.t+' <span class="'+m.c+'">'+brl(total)+'</span></h2>'+f+l;
}

function render(){
 var tabs=[["resumo","Resumo"],["renda","Rendas"],["poupanca","Poupanças"],["divida","Dívidas"]];
 nav.innerHTML=tabs.map(function(t){return '<button data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="true"':"")+'>'+t[1]+'</button>'}).join("");
 app.innerHTML=tab==="resumo"?resumo():lista(tab);
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function add(type){
 var name=document.getElementById("f-name").value.trim(),v=num(document.getElementById("f-val").value),pe=document.getElementById("f-paid"),paid=pe?num(pe.value):0;
 if(!name){msg="Digite um nome.";render();return}
 if(edit){S.items.forEach(function(i){if(i.id===edit){i.name=name;i.value=v;if(type==="divida"){i.paid=paid}}})}
 else{var it={id:uid(),type:type,name:name,value:v};if(type==="divida"){it.paid=paid}S.items.push(it)}
 edit=null;msg="Salvo.";save();render();
}
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-tab]");
 if(t){tab=t.dataset.tab;edit=null;del=null;msg="";render();window.scrollTo(0,0);return}
 var b=ev.target.closest("[data-a]");if(!b){return}
 var a=b.dataset.a,id=b.dataset.id;
 if(a==="save"){add(b.dataset.t)}
 else if(a==="cancel"){edit=null;msg="";render()}
 else if(a==="edit"){edit=id;del=null;msg="";render();window.scrollTo(0,0)}
 else if(a==="del"){del=id;render()}
 else if(a==="del2"){S.items=S.items.filter(function(i){return i.id!==id});del=null;save();render()}
 else if(a==="bk-gen"){backup=JSON.stringify(S);msg="Backup gerado. Copie o texto acima.";try{navigator.clipboard.writeText(backup).then(function(){msg="Backup gerado e copiado."}).catch(function(){}).then(render)}catch(e){}render()}
 else if(a==="bk-res"){try{var d=JSON.parse(document.getElementById("bk").value);if(d&&Array.isArray(d.items)){S=d;save();backup="";msg="Backup restaurado."}else{msg="Texto de backup inválido."}}catch(e){msg="Texto de backup inválido."}render()}
});
var MISS={};
function dcfg(){return {base:"BRL",view:"BRL",cur:[{c:"BRL",r:1,d:2},{c:"JPY",r:0,d:0}]}}
function norm(){if(!S.cfg||!Array.isArray(S.cfg.cur)){S.cfg=dcfg()}S.items.forEach(function(i){if(!i.cur){i.cur=S.cfg.base}})}
function cinfo(c){return S.cfg.cur.filter(function(x){return x.c===c})[0]}
function rate(c){var x=cinfo(c);return c===S.cfg.base?1:(x&&x.r>0?x.r:0)}
function conv(v,c,to){var a=rate(c),b=rate(to);return a&&b?v*a/b:null}
function fmt(n,c){var x=cinfo(c),d=x?x.d:2;try{return new Intl.NumberFormat("pt-BR",{style:"currency",currency:c,minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0)}catch(e){return (n||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d})+" "+c}}
function brl(n){return fmt(n,S.cfg.view)}
function tot(type,f){var t=0;S.items.forEach(function(i){if(i.type!==type){return}var x=conv(f(i),i.cur,S.cfg.view);if(x===null){MISS[i.cur]=1}else{t+=x}});return t}
function nat(type,f){var g={};S.items.forEach(function(i){if(i.type===type){g[i.cur]=(g[i.cur]||0)+f(i)}});var k=Object.keys(g);return k.length?k.map(function(c){return fmt(g[c],c)}).join(" + "):"Nada cadastrado"}
function opts(sel){return S.cfg.cur.map(function(x){return '<option'+(x.c===sel?' selected':'')+'>'+esc(x.c)+'</option>'}).join("")}
function chips(){return '<div class="chips">'+S.cfg.cur.map(function(x){return '<button class="chip" data-a="view" data-c="'+x.c+'"'+(S.cfg.view===x.c?' aria-pressed="true"':'')+'>'+esc(x.c)+'</button>'}).join("")+'</div>'}
function bkblock(){return '<h2>Backup</h2><div class="card"><p class="sub" style="margin:0 0 8px">Se você limpar os dados do navegador, tudo some. Gere um backup e guarde o texto em um lugar seguro.</p><textarea id="bk" aria-label="Texto do backup">'+esc(backup)+'</textarea><button class="btn" data-a="bk-gen">Gerar backup</button><button class="btn ghost" data-a="bk-res">Restaurar do texto</button></div>'}
function warn(){var m=Object.keys(MISS);return m.length?'<p class="msg warn">Sem cotação para: '+esc(m.join(", "))+'. Esses valores ficaram fora dos totais. Defina em Ajustes.</p>':""}
function resumo(){
 var r=tot("renda",val),p=tot("poupanca",val),d=tot("divida",rest),max=Math.max(r,p,d,1),V=S.cfg.view;
 var rows=[["Renda mensal",r,"inc"],["Poupança",p,"sav"],["Dívidas restantes",d,"debt"]];
 var bars=rows.map(function(x,k){var y=k*44,w=x[1]>0?Math.max(x[1]/max*320,4):0;return '<text x="0" y="'+(y+12)+'" class="lab">'+x[0]+'</text><text x="320" y="'+(y+12)+'" text-anchor="end" class="val">'+brl(x[1])+'</text><rect x="0" y="'+(y+20)+'" width="320" height="12" rx="6" fill="var(--line)"/><rect x="0" y="'+(y+20)+'" width="'+w+'" height="12" rx="6" class="b-'+x[2]+'"/>'}).join("");
 var net=p-d;
 var debts=S.items.filter(function(i){return i.type==="divida"&&rest(i)>0}).map(function(i){return {i:i,v:conv(rest(i),i.cur,V)||0}}).sort(function(a,b){return b.v-a.v});
 var dm=debts.length&&debts[0].v>0?debts[0].v:1;
 var dl=debts.length?debts.map(function(o){return '<div style="margin-bottom:10px"><div class="row"><span>'+esc(o.i.name)+'</span><b>'+fmt(rest(o.i),o.i.cur)+'</b></div><div class="track"><i style="width:'+Math.max(o.v/dm*100,2)+'%"></i></div></div>'}).join(""):'<p class="empty">Nenhuma dívida em aberto.</p>';
 return '<p class="sub">Totais convertidos para '+esc(V)+'. Toque para trocar:</p>'+chips()+warn()
 +'<div class="stats"><div class="stat"><small>Renda mensal</small><b class="inc">'+brl(r)+'</b><small class="n">'+nat("renda",val)+'</small></div><div class="stat"><small>Poupança</small><b class="sav">'+brl(p)+'</b><small class="n">'+nat("poupanca",val)+'</small></div><div class="stat"><small>Dívidas restantes</small><b class="debt">'+brl(d)+'</b><small class="n">'+nat("divida",rest)+'</small></div><div class="stat"><small>Poupança menos dívidas</small><b class="'+(net>=0?"inc":"debt")+'">'+brl(net)+'</b></div></div>'
 +'<div class="card"><svg viewBox="0 0 320 132" role="img" aria-label="Comparação entre renda, poupança e dívidas">'+bars+'</svg></div><h2>Dívidas por item</h2><div class="card">'+dl+'</div>';
}
function lista(type){
 var m=T[type],items=S.items.filter(function(i){return i.type===type}),V=S.cfg.view;
 var e=edit?S.items.filter(function(i){return i.id===edit&&i.type===type})[0]:null;
 var f='<div class="card"><label for="f-name">Nome</label><input id="f-name" placeholder="Ex.: '+(type==="renda"?"Salário":type==="poupanca"?"Caderneta do banco":"Cartão de crédito")+'" value="'+(e?esc(e.name):"")+'"><label for="f-cur">Moeda</label><select id="f-cur">'+opts(e?e.cur:V)+'</select><label for="f-val">'+m.l+'</label><input id="f-val" inputmode="decimal" placeholder="0,00" value="'+(e?String(e.value).replace(".",","):"")+'">'
 +(type==="divida"?'<label for="f-paid">Já pago</label><input id="f-paid" inputmode="decimal" placeholder="0,00" value="'+(e&&e.paid?String(e.paid).replace(".",","):"")+'">':"")
 +'<button class="btn" data-a="save" data-t="'+type+'">'+(e?"Salvar alterações":"Adicionar "+m.one)+'</button>'+(e?'<button class="btn ghost" data-a="cancel">Cancelar</button>':"")+'<p class="msg">'+esc(msg)+'</p></div>';
 var total=tot(type,type==="divida"?rest:val);
 var l=items.length?items.map(function(i){
  var x=conv(type==="divida"?rest(i):i.value,i.cur,V),extra=i.cur!==V&&x!==null?'<div class="sub">≈ '+brl(x)+'</div>':"";
